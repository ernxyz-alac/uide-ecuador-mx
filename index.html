<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live Game - MEX vs ECU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        body {
            font-family: sans-serif;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        #main-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Simplified score container with vertical alignment */
        .live-score-container {
            position: absolute;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: white;
            transition: opacity 0.3s ease;
            
            /* HIGHLIGHT: To move the entire score block vertically, adjust this 'top' or use 'margin-top' */
            top: 0%; 
        }

        .score-text {
            font-weight: bold;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            line-height: 1;
        }

        /* 
           HIGHLIGHT: 
           - To separate the scores from each other, adjust the 'gap' property.
           - To move the scores vertically, adjust the 'top' property in the media queries below.
        */

        /* Horizontal 768x320 */
        .layout-768x320 .live-score-container {
            gap: 5%;
            top: 22%;
        }
        
        .layout-768x320 .score-text {
            font-size: 90px;
        }
        
        /* Vertical 600x810 */
        .layout-600x810 .live-score-container {
            gap: 50px;
            top: 12%;
            right: 1%;
        }
        
        .layout-600x810 .score-text {
            font-size: 120px;
        }
        
        /* Horizontal 1920x768 */
        .layout-1920x768 .live-score-container {
            gap: 5%;
            top: 23%;
        }
        
        .layout-1920x768 .score-text {
            font-size: 240px;
        }
    </style>
</head>
<body>
<div id="main-container">
    <!-- The video source is handled dynamically by JavaScript below -->
    <video id="video" autoplay muted loop playsinline preload="auto"></video>

    <!-- Simplified Layout: No flags, only scores vertically aligned -->
    <div id="mainCard" class="live-score-container">
        <div id="home-score" class="score-text"></div>
        <!-- Vertical separator managed by CSS gap -->
        <div id="away-score" class="score-text"></div>
    </div>
</div>

<script>
    /**
     * Logic for Screen Size and Video Selection:
     * Shows 'ec_vs_ger.mp4' for 768x320 (horizontal)
     * Shows 'ec_vs_ger_vert.mp4' for 600x800 (vertical)
     */
     function updateVideoSource() {
         const video = document.getElementById("video");
         const body = document.body;
     
         const width = window.innerWidth;
         const height = window.innerHeight;
     
         // Remove previous layout classes
         body.classList.remove(
             "layout-768x320",
             "layout-600x810",
             "layout-1920x768"
         );
     
         let videoSrc = "";
     
        if (
            width >= 758 && width <= 778 &&
            height >= 310 && height <= 330
        ) {
            videoSrc = "./video/hor.mp4";
            body.classList.add("layout-768x320");
        
        } else if (
            width >= 590 && width <= 610 &&
            height >= 800 && height <= 820
        ) {
            videoSrc = "./video/ver.mp4";
            body.classList.add("layout-600x810");
        
        } else if (
            width >= 1910 && width <= 1930 &&
            height >= 758 && height <= 778
        ) {
            videoSrc = "./video/hor.mp4";
            body.classList.add("layout-1920x768");
        
        } else {
            videoSrc = (height > width)
                ? "./video/ver.mp4"
                : "./video/hor.mp4";
        }
     
         const absoluteVideoPath = new URL(videoSrc, window.location.href).href;
     
         if (video.src !== absoluteVideoPath) {
             video.src = videoSrc;
             video.load();
         }
     }

    // Initialize video and listen for window size changes
    updateVideoSource();
    window.addEventListener('resize', updateVideoSource);

    /**
     * Score Logic:
     * Getting the score from the server and managing local storage.
     * Match: Ecuador vs Alemania
     */
    const GAME_ID = "mexico_vs_ecuador";
    const STORAGE_KEY = "mexico_vs_ecuador_score";
    
    // Load initial score from local storage or default to 0-0
    let previousNumbers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [0, 0];
    document.getElementById("home-score").textContent = previousNumbers[0];
    document.getElementById("away-score").textContent = previousNumbers[1];

    async function loadData() {
        try {
            const res = await fetch("https://doradobet-server-qczt.onrender.com/data?gameId=16933952");
            // const res = await fetch("http://localhost:9009/data?gameId=16933952");
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            
            const data = await res.json();
            
            if (!data.score || data.score.trim() === "") return;

            // Parse score from format like "Team A -> 1, Team B -> 2"
            const scoreParts = data.score.split(", ");
            
            if (scoreParts.length === 2) {
                const homeScore = parseInt(scoreParts[0].split(" -> ")[1]);
                const awayScore = parseInt(scoreParts[1].split(" -> ")[1]);
                const currentNumbers = [homeScore, awayScore];
                
                const savedScore = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [0, 0];

                // Update UI and storage if the score changed
                if (currentNumbers[0] !== savedScore[0] || currentNumbers[1] !== savedScore[1]) {
                    document.getElementById("home-score").textContent = currentNumbers[0];
                    document.getElementById("away-score").textContent = currentNumbers[1];
                    
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentNumbers));
                    previousNumbers = currentNumbers;
                }
            }
        } catch (error) { console.error("Error loading data:", error); }
    }

    // Fetch data immediately and then every second
    loadData();
    setInterval(loadData, 3000);
</script>
</body>
</html>
